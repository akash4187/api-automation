# =============================================================
# API Automation Framework - Configuration
# =============================================================

# Environment (dev, staging, prod)
environment=dev

# Base URLs per environment (Reqres - sample API)
base.url.dev=https://reqres.in/api
base.url.staging=https://reqres.in/api
base.url.prod=https://reqres.in/api

# AutomationExercise.com
automation.exercise.base.url=https://automationexercise.com

# Authentication
auth.username=admin@example.com
auth.password=password123
auth.token=

# Timeouts (in seconds)
connection.timeout=30
read.timeout=30

# Retry Configuration
retry.max.attempts=3
retry.delay.ms=1000

# Logging
log.request=true
log.response=true
